server:
  port: 8082

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group      # fixed group id -> Kafka remembers committed offsets across restarts
      auto-offset-reset: earliest       # a brand-new group starts from the beginning
      enable-auto-commit: false         # commit only after successful processing
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.notification.model.OrderEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:                           # used only to publish failed records to the dead-letter topic
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topic: order-events
